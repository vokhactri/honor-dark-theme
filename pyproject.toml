[project]
name = "honor-dark-theme"
version = "1.0.6"
description = "Dark Glare and Dark Flat icon themes for Honor phones"
requires-python = ">=3.14"
# Pinned to the versions that rendered the approved icons. Newer releases can shift resampling and colours.
dependencies = [
    "numpy==2.5.4",
    "pillow==12.3.0",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
