[project]
name = "honor-themes"
version = "1.6.0"
description = "Dark Flat and Liquid Glass icon themes for Honor phones"
requires-python = ">=3.14"
# Pinned to the versions that rendered the approved icons. Newer releases can shift resampling and colours.
dependencies = [
    "av==19.0.1",
    "lz4==4.4.5",
    "numpy==2.5.4",
    "pillow==12.3.0",
    "resvg-py==0.5.0",
    "scipy==1.18.1",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
