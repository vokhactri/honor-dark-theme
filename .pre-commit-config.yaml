# Install once per clone: uv run pre-commit install
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version
    rev: 0.13.1
    hooks:
      - id: uv-lock
  # uv run takes ruff and basedpyright from uv.lock. CI runs only ruff, so the type check happens here.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: unsupported
        types: [python]
        pass_filenames: false
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: unsupported
        types: [python]
        pass_filenames: false
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: unsupported
        types: [python]
        pass_filenames: false
